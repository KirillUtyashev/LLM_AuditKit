# A mechanical mixed-form cohort, not a historical experiment design.
# Each assignment is explicit; the test loader does not enumerate combinations.
# Rowan intentionally recurs across jobs as the same supplied applicant.
cohort:
  template_columns:
    primary: template_1
    alternate: template_2
    extended: template_3
  jobs:
    - scenario_id: library-set-a
      job_id: job-library
      Text: Help organize a fictional community library's records.
      research_note: Synthetic mixed-form verification only.
      assignments:
        - template_id: primary
          family: application_1950_1960
          candidate_order: 3
        - template_id: extended
          family: university_two_jobs_internship_2010_2020
          candidate_order: 2
        - template_id: alternate
          family: university_one_job_1990
          candidate_order: 1
      expected_families:
        - university_one_job_1990
        - university_two_jobs_internship_2010_2020
        - application_1950_1960
    - scenario_id: workshop-set-a
      job_id: job-workshop
      Text: Maintain records for a fictional teaching workshop.
      research_note: All values and candidate assignments are researcher supplied.
      assignments:
        - template_id: alternate
          family: university_student_job_2000_2002
          candidate_order: 3
        - template_id: primary
          family: school_employment_1970_1980
          candidate_order: 2
        - template_id: extended
          family: application_1950_1960
          candidate_order: 1
      expected_families:
        - application_1950_1960
        - school_employment_1970_1980
        - university_student_job_2000_2002
