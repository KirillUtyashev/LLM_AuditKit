dataset:
  path: local/chicago-1950-smoke/ads-v3.csv
  job_posting_column: Text
  context_columns:
    city: city
    year: year
prompt:
  template_path: prompts/newspaper_templates.txt
  system_template_path: ../../../examples/template_generation/prompts/resume_system.txt
output:
  path: local/chicago-1950-smoke/templates-gpt55-medium-parts.csv
generation:
  templates_per_scenario: 2
  required_placeholders: [name, qualification]
  response_mode: parts
  model_config_id: resume-layouts
execution:
  mode: async
  batch_size: 5
  save_after_each_result: true
inference:
  models:
    - config_id: resume-layouts
      provider: openai
      model: gpt-5.5
      parameters:
        reasoning_effort: medium
        max_tokens: 16000
