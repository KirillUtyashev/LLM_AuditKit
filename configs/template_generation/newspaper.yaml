dataset:
  path: ../../outputs/ocr/ads.csv
  job_posting_column: Text
  context_columns:
    city: city
    year: year
prompt:
  template_path: ../../examples/template_generation/prompts/newspaper_templates.txt
  system_template_path: ../../examples/template_generation/prompts/resume_system.txt
output:
  path: ../../outputs/pipeline/templates.csv
generation:
  templates_per_scenario: 2
  required_placeholders: [name, qualification]
  model_config_id: resume-layouts
execution:
  mode: async
  batch_size: 5
  save_after_each_result: true
inference:
  models:
    - config_id: resume-layouts
      provider: openai
      model: gpt-4o-2024-08-06
      parameters:
        temperature: 0
        max_tokens: 4000
