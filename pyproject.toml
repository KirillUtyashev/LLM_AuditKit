[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-auditkit"
version = "0.0.0"
description = "A toolkit for auditing large language model behavior in hiring experiments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["edsl[inference]>=1.0.8,<1.1"]

[project.optional-dependencies]
test = ["pytest>=8", "python-dotenv>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "live_inference: opt-in tests that make paid calls to external model providers",
]
