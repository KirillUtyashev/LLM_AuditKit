name: Publish static website

on:
  push:
    branches: [main, feat/37-static-pipeline-showcase]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
      - "tests/website/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/37-static-pipeline-showcase'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check static JavaScript
        run: |
          test ! -e website/local
          node --check website/app.mjs
          node --test tests/website/*.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
